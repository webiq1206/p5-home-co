name: P5 document service
on:
  push:
    branches: [feat/shared-document-service-20260917]
permissions:
  contents: write
concurrency:
  group: p5-document-service-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: p5_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: p5_documents_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U p5_test -d p5_documents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOCUMENT_TEST_DATABASE_URL: postgres://p5_test:disposable_ci_only@127.0.0.1:5432/p5_documents_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply guarded adapter and recovery refinements
        run: |
          mkdir -p document-service-verification
          node scripts/integrate-document-service.mjs
          node services/document-service/scripts/harden-recovery.mjs
          git diff --check
          git config user.name 'P5 Document Service Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/p5/analysisWork.ts lib/p5/backgroundJobs.ts services/document-service/src/store.mjs services/document-service/src/pipeline.mjs services/document-service/test/integration.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve source evidence and terminal failures across concurrent recovery'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git rev-parse HEAD > document-service-verification/tested-commit.txt
      - name: Install standalone dependencies
        working-directory: services/document-service
        run: npm ci --no-audit --no-fund
      - name: Real database, HTTP, PDF and source-coverage tests
        working-directory: services/document-service
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../../document-service-verification/service-tests.log
      - name: Install existing website dependencies
        run: npm ci --no-audit --no-fund
      - name: Existing estimator compatibility regressions
        run: |
          set -o pipefail
          node --import tsx --test --test-concurrency=1 tests/p5-*.test.ts 2>&1 | tee document-service-verification/estimator-tests.log
      - name: Production website build with remote mode disabled
        run: |
          set -o pipefail
          npm run build 2>&1 | tee document-service-verification/site-build.log
      - name: Build production worker container
        run: |
          set -o pipefail
          docker build -t p5-document-service:verified services/document-service 2>&1 | tee document-service-verification/container-build.log
      - name: Package exact tested source and installation files
        if: always()
        run: |
          tar --exclude=node_modules --exclude=verification -czf document-service-verification/service-source.tgz services/document-service lib/p5/documentServiceClient.ts scripts/integrate-document-service.mjs tests/p5-document-service.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-service-verification
          path: |
            document-service-verification
            services/document-service/verification
          retention-days: 14
