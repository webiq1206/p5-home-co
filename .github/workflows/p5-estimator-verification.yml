name: P5 estimator policy and workflow verification
on:
  push:
    branches: [fix/estimator-flow-20260913,release/estimator-overhaul-20260912,wip/estimator-overhaul-20260912,fix/research-format,fix/pricing-batches,fix/pricing-latency,fix/readable-estimates,fix/complete-scope-pricing, codex/activate-cost-books-20260911, codex/finalize-estimators-20260911, codex/p5-upload-receipt-fix-20260910, codex/p5-intelligent-wizard-20260910, main, codex/p5-estimator-policy-20260910, codex/p5-merge-all-20260910, codex/p5-complete-main-20260910]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Financial policy regression tests
        run: node --import tsx --test tests/p5-pricing.test.ts tests/p5-planning-books.test.ts tests/p5-scope-pricing.test.ts tests/p5-presentation.test.ts tests/p5-submit-progress.test.ts tests/p5-document-ledger.test.ts tests/p5-processing-status.test.ts
      - name: Isolated persistence, delivery failure and PDF checks
        run: |
          node --import tsx scripts/test-p5-pricing-work.mts
          node --import tsx scripts/test-p5-background.mts
          node --import tsx scripts/test-p5-workflow.mts
          node --import tsx scripts/test-p5-receipt.mts
          node --import tsx scripts/test-p5-upload.mts
          node --import tsx scripts/test-p5-resumable.mts
          node --import tsx scripts/test-p5-plan-rendering.mts
          node --import tsx --test tests/p5-adaptive.test.ts tests/p5-clarifications.test.ts tests/p5-provider.test.ts tests/p5-wizard-resume.test.ts tests/p5-extraction-values.test.ts tests/p5-multipart.test.ts tests/p5-object-storage.test.ts tests/p5-file-snapshot.test.ts tests/p5-upload-transfer.test.ts
      - name: TypeScript verification
        run: npx tsc --noEmit
      - name: Production build and existing repository gates
        run: npm run build
      - name: Production browser rendering and interaction checks
        run: |
          npx next start -p 5000 > /tmp/p5-estimator-server.log 2>&1 &
          node -e 'const u="http://127.0.0.1:5000/estimate/p5-preview";let n=0;const t=setInterval(async()=>{try{const r=await fetch(u);if(r.ok){clearInterval(t)}}catch{}if(++n>90){clearInterval(t);process.exit(1)}},1000)'
          P5_PARENT=1 node scripts/p5-mobile-navigation.mjs
          node --import tsx scripts/p5-estimator-browser.mjs
          P5_TEST_BROWSER=webkit node --import tsx scripts/p5-estimator-browser.mjs
          node scripts/p5-admin-pricing-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-estimator-verification
          path: |
            p5-verification
            /tmp/p5-estimator-server.log
          retention-days: 14

  lead-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p5_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: p5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p5_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://p5_test:isolated_ci_only@127.0.0.1:5432/p5_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://p5_test:isolated_ci_only@127.0.0.1:5432/p5_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Apply migrations to isolated PostgreSQL
        run: node tools/migrate.ts
      - name: Verify watchdog and HubSpot task lifecycle with intercepted transports
        run: node --test --test-concurrency=1 tests/watchdog.integration.test.ts tests/hubspot-tasks.integration.test.ts
