name: p5 public planning contact review
on:
  pull_request:
    branches: [main]
    paths:
      - components/CompanyFinder.tsx
      - scripts/verify-planning-contact.cjs
      - tests/fixtures/planning-contact-before.tsx.txt
      - .github/workflows/planning-contact.yml
      - scripts/branding-ci-evidence-bound.mjs
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-planning-contact.cjs p5
      - name: Bound complete artifact group 1 to64MiB
        id: bounded_artifact_01
        if: always()
        run: node scripts/branding-ci-evidence-bound.mjs --strict-64m 'test-results/planning-contact/'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.bounded_artifact_01.outcome == 'success' && steps.bounded_artifact_01.outputs.ready == 'true' }}
        with:
          name: p5-planning-contact-${{ github.sha }}
          path: branding-ci-evidence/complete.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

